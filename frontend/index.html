<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todocontenedor — Iniciar sesión</title>
    <link rel="stylesheet" href="css/design-system.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="icon" href="images/favicon-32x32.png" sizes="32x32" type="image/png">
</head>
<body>
    <div class="login-page">
        <div class="login-card">
            <img src="images/logo.jfif" alt="Todocontenedor">
            <h1>Todocontenedor</h1>
            <p>Sistema de Gestión de Fletes y Logística</p>

            <div class="form-group">
                <label for="username">Usuario</label>
                <input type="text" id="username" placeholder="Ingresa tu usuario" autocomplete="username">
            </div>

            <div class="form-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" placeholder="Ingresa tu contraseña" autocomplete="current-password">
            </div>

            <button class="login-btn" id="loginBtn">
                Iniciar sesión
            </button>

            <p class="login-error" id="loginError">Usuario o contraseña incorrectos</p>
        </div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
