<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Wialon — Token recibido</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Montserrat', sans-serif; background: #f5f5f7; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
        .card { background: white; border-radius: 16px; padding: 40px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); max-width: 600px; text-align: center; }
        h1 { font-size: 22px; font-weight: 800; margin-bottom: 8px; }
        p { font-size: 13px; color: #86868b; margin-bottom: 20px; }
        .token-box { background: #1d1d1f; color: #34c759; padding: 16px; border-radius: 10px; font-family: 'Consolas', monospace; font-size: 12px; word-break: break-all; text-align: left; margin-bottom: 16px; user-select: all; cursor: pointer; }
        .status { font-size: 14px; font-weight: 600; }
        .ok { color: #34c759; }
        .err { color: #ff3b30; }
        .btn { background: #0071e3; color: white; border: none; padding: 10px 24px; border-radius: 10px; font-size: 13px; font-weight: 600; cursor: pointer; font-family: 'Montserrat'; margin-top: 12px; }
    </style>
</head>
<body>
    <div class="card">
        <h1>🛰️ Wialon GPS — Conexión</h1>
        <p id="msg">Procesando token...</p>
        <div class="token-box" id="tokenBox" onclick="copyToken()">Esperando...</div>
        <p class="status" id="status"></p>
        <button class="btn" id="copyBtn" style="display:none" onclick="copyToken()">📋 Copiar token</button>
    </div>
    <script>
        const params = new URLSearchParams(window.location.hash.substring(1));
        const token = params.get('access_token');
        const error = params.get('error');

        if (token) {
            document.getElementById('tokenBox').textContent = token;
            document.getElementById('msg').textContent = 'Token obtenido correctamente. Haz clic para copiar:';
            document.getElementById('status').innerHTML = '<span class="ok">✓ Conexión exitosa con Wialon</span>';
            document.getElementById('copyBtn').style.display = 'inline-block';
            localStorage.setItem('wialon_token', token);

            // Test the token immediately
            fetch(`https://hst-api.wialon.com/wialon/ajax.html?svc=token/login&params={"token":"${token}"}`)
                .then(r => r.json())
                .then(data => {
                    if (data.eid) {
                        document.getElementById('status').innerHTML += '<br><span class="ok">✓ Sesión activa: ' + (data.user?.nm || 'OK') + '</span>';
                        // Get units (vehicles)
                        return fetch(`https://hst-api.wialon.com/wialon/ajax.html?svc=core/search_items&params={"spec":{"itemsType":"avl_unit","propName":"*","propValueMask":"*","sortType":"sys_name"},"force":1,"flags":1025,"from":0,"to":0}&sid=${data.eid}`);
                    }
                })
                .then(r => r ? r.json() : null)
                .then(data => {
                    if (data && data.items) {
                        document.getElementById('status').innerHTML += `<br><span class="ok">✓ ${data.items.length} vehículos encontrados en Wialon</span>`;
                        localStorage.setItem('wialon_units', JSON.stringify(data.items));
                    }
                })
                .catch(e => {
                    document.getElementById('status').innerHTML += `<br><span class="err">Error: ${e.message}</span>`;
                });
        } else if (error) {
            document.getElementById('tokenBox').textContent = 'Error: ' + error;
            document.getElementById('msg').textContent = 'No se pudo obtener el token.';
            document.getElementById('status').innerHTML = '<span class="err">✗ Autorización denegada</span>';
        } else {
            document.getElementById('tokenBox').textContent = 'No se recibió token. Verifica la URL.';
            document.getElementById('msg').textContent = 'Abre la URL de autorización primero.';
        }

        function copyToken() {
            if (token) {
                navigator.clipboard.writeText(token);
                document.getElementById('copyBtn').textContent = '✓ Copiado!';
                setTimeout(() => document.getElementById('copyBtn').textContent = '📋 Copiar token', 2000);
            }
        }
    </script>
</body>
</html>
